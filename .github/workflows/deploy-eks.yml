name: Deploy to EKS

on:
  push:
    branches:
      - deploiement  # ta branche de déploiement

env:
  AWS_REGION: eu-west-3
  EKS_CLUSTER_NAME: my-eks-cluster
  ECR_REGISTRY: 961341551644.dkr.ecr.eu-west-3.amazonaws.com

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Update kubeconfig for EKS cluster
      run: |
        aws eks update-kubeconfig --region $AWS_REGION --name $EKS_CLUSTER_NAME

    - name: Deploy Gateway
      run: |
        kubectl set image deployment/gateway-app gateway-app=$ECR_REGISTRY/gateway-image:latest --record
        kubectl rollout status deployment/gateway-app

    - name: Deploy Location
      run: |
        kubectl set image deployment/location-app location-app=$ECR_REGISTRY/location-image:latest --record
        kubectl rollout status deployment/location-app

    - name: Deploy Vehicules
      run: |
        kubectl set image deployment/vehicule-app vehicule-app=$ECR_REGISTRY/vehicule-image:latest --record
        kubectl rollout status deployment/vehicule-app

    - name: Deploy Client
      run: |
        kubectl set image deployment/client-app client-app=$ECR_REGISTRY/client-image:latest --record
        kubectl rollout status deployment/client-app
