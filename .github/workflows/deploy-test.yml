name: CI/CD Pipeline

on:
  push:
    branches:
      - deploiement  # change si ta branche s'appelle autrement

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      AWS_REGION: eu-west-3
      ECR_REGISTRY: 961341551644.dkr.ecr.eu-west-3.amazonaws.com
      PROJECT_KEY: gestionvehicules

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Cache Maven packages
      uses: actions/cache@v3
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-m2-

    - name: Build with Maven
      run: mvn clean install -DskipTests

    - name: SonarQube Scan
      run: |
        mvn sonar:sonar \
          -Dsonar.projectKey=${{ env.PROJECT_KEY }} \
          -Dsonar.organization=<votre-org-si-sonarcloud> \
          -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} \
          -Dsonar.login=${{ secrets.SONAR_TOKEN }} \
          -Dsonar.branch.name=deploiement

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v1

    - name: Build and push Docker images
      run: |
        docker-compose build
        docker tag client $ECR_REGISTRY/client-image:latest
        docker tag gateway $ECR_REGISTRY/gateway-image:latest
        docker tag location $ECR_REGISTRY/location-image:latest
        docker tag vehicule $ECR_REGISTRY/vehicule-image:latest

        docker push $ECR_REGISTRY/client-image:latest
        docker push $ECR_REGISTRY/gateway-image:latest
        docker push $ECR_REGISTRY/location-image:latest
        docker push $ECR_REGISTRY/vehicule-image:latest
