name: Deploy to EKS

on:
  push:
    branches:
      - deploiement

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v3

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: eu-west-3
        role-to-assume: arn:aws:iam::961341551644:role/eks-cluster-role
        role-session-name: github-actions-session
        role-duration-seconds: 14400

    - name: Update kubeconfig to connect to EKS
      run: aws eks update-kubeconfig --region eu-west-3 --name my-eks-cluster

    - name: Deploy Gateway
      run: kubectl apply -f k8s/gateway.yaml

    - name: Deploy Microservice Gestion Location
      run: kubectl apply -f k8s/gestionlocation.yaml

    - name: Deploy Microservice Gestion Vehicules
      run: kubectl apply -f k8s/gestionvehicules.yaml

    - name: Verify Deployment
      run: kubectl get pods -n default
