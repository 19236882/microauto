name: Analyse + Déploiement ECR - gestionlocations

on:
  push:
    branches:
      - deploiement
    paths:
      - 'gestionlocations/**'
  pull_request:
    branches:
      - deploiement
    paths:
      - 'gestionlocations/**'

jobs:
  sonarcloud:
    name: Analyse SonarCloud
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Configuration Java
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Analyse avec Maven
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          cd gestionlocations
          mvn clean verify sonar:sonar \
            -Dsonar.projectKey=microauto_gestionlocations \
            -Dsonar.organization=microauto \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.sources=src \
            -Dsonar.java.binaries=target/classes

  build-and-push:
    name: Build & Push to Amazon ECR
    runs-on: ubuntu-latest
    needs: sonarcloud  # Exécute cette étape seulement si Sonar réussit

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-3

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          cd gestionlocations
          docker build -t location-image .

      - name: Tag Docker image
        run: |
          docker tag location-image:latest 961341551644.dkr.ecr.eu-west-3.amazonaws.com/location-image:latest

      - name: Push Docker image to Amazon ECR
        run: |
          docker push 961341551644.dkr.ecr.eu-west-3.amazonaws.com/location-image:latest
